version: 2

project_name: httpstat

before:
  hooks:
    - go mod tidy

builds:
  - binary: httpstat
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Homebrew formula is maintained manually in vandancd/homebrew-tap.
# On each release, update Formula/httpstat.rb with the new version tag and
# the sha256 of the new source tarball:
#   shasum -a 256 <(curl -sL https://github.com/vandancd/httpstat/archive/refs/tags/vX.Y.Z.tar.gz)
