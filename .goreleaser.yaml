version: 2

project_name: httpstat

before:
  hooks:
    - go mod tidy

builds:
  - binary: httpstat
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: httpstat
    repository:
      owner: vandancd
      name: homebrew-tap
    homepage: "https://github.com/vandancd/httpstat"
    description: "HTTP performance measurement tool with waterfall output and trace"
